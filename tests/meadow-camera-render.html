<!doctype html><html lang="en"><meta charset="utf-8"><title>Meadow camera collision check</title>
<style>body{margin:0;background:#d4e9f2;font:16px sans-serif}canvas{display:block;max-width:100%;height:auto}button{margin:5px;padding:9px}pre{white-space:pre-wrap}</style>
<canvas></canvas>
<button data-view="low">Near the grass</button><button data-view="deep">Look straight up</button>
<button data-view="clear">Clear orbit</button><button data-view="far">Maximum zoom out</button>
<button data-view="slope">Hillside</button><button id="legacy">Disable collision</button>
<button id="sweep">Sweep 360°</button>
<fieldset><legend>Simulated gamepad</legend>
<button id="zoom-in">Hold R3 + stick up</button><button id="zoom-out">Hold R3 + stick down</button>
<button id="release-r3">Release R3</button><button id="neutral">Center stick</button>
<button id="disconnect">Disconnect pad</button><button id="input-enabled">Suspend input</button>
<button id="double-r3">Double tap R3</button>
<button id="slow-double-r3">Slower double tap with drift</button>
<button id="wheel-in">Wheel to first person</button><button id="wheel-out">Wheel to third person</button>
</fieldset><pre id="status"></pre>
<script type="module" src="./meadow-camera-render.js"></script></html>
